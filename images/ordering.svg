<text x="852" y="392" font-size="11.5" fill="#62626E">2 L · split on opening</text>
<text x="840" y="420" font-size="12" fill="#62626E">Already off the count — it lands in the</text>
<text x="840" y="436" font-size="12" fill="#62626E">day close as a known loss, not the gap.</text>

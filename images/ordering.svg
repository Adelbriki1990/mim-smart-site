<text x="840" y="654" font-size="34" font-weight="700" fill="#16161D">QR 6,214</text>
<rect x="840" y="670" width="189.62" height="40" rx="20" fill="#5B3FE0"/>
<text x="934.81" y="694.97" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Send to Central Store</text>
<text x="28" y="752" font-size="12.5" fill="#62626E">order = par − counted, rounded up to the pack · a blank count orders nothing until someone counts it</text>

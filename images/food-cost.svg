<text x="764" y="270" font-size="17" font-weight="600" fill="#16161D">Where the gap is</text>
<text x="770" y="301.26" font-size="12" font-weight="600" fill="#62626E">Ingredient</text>
<text x="982" y="301.26" font-size="12" font-weight="600" fill="#62626E" text-anchor="end">Short</text>
<text x="1140" y="301.26" font-size="12" font-weight="600" fill="#62626E" text-anchor="end">Value</text>
<rect x="764" y="310" width="388" height="30" rx="16" fill="#FFFFFF"/>
<text x="776" y="329.62" font-size="13" font-weight="600" fill="#16161D">Salmon fillet</text>
<text x="982" y="329.62" font-size="13" font-weight="600" fill="#9A3412" text-anchor="end">−18.4 kg</text>
<text x="1140" y="329.62" font-size="13" font-weight="700" fill="#16161D" text-anchor="end">QR 4,120</text>
<rect x="764" y="343" width="388" height="30" rx="16" fill="#FFFFFF"/>
<text x="776" y="362.62" font-size="13" font-weight="600" fill="#16161D">Ribeye</text>
<text x="982" y="362.62" font-size="13" font-weight="600" fill="#9A3412" text-anchor="end">−9.1 kg</text>
<text x="1140" y="362.62" font-size="13" font-weight="700" fill="#16161D" text-anchor="end">QR 3,240</text>
<rect x="764" y="376" width="388" height="30" rx="16" fill="#FFFFFF"/>
<text x="776" y="395.62" font-size="13" font-weight="600" fill="#16161D">Butter</text>
<text x="982" y="395.62" font-size="13" font-weight="600" fill="#9A3412" text-anchor="end">−22.0 kg</text>
<text x="1140" y="395.62" font-size="13" font-weight="700" fill="#16161D" text-anchor="end">QR 1,880</text>
<rect x="764" y="409" width="388" height="30" rx="16" fill="#FFFFFF"/>
<text x="776" y="428.62" font-size="13" font-weight="600" fill="#16161D">Olive oil</text>
<text x="982" y="428.62" font-size="13" font-weight="600" fill="#9A3412" text-anchor="end">−7.5 L</text>
<text x="1140" y="428.62" font-size="13" font-weight="700" fill="#16161D" text-anchor="end">QR 940</text>
<rect x="764" y="442" width="388" height="30" rx="16" fill="#FFFFFF"/>
<text x="776" y="461.62" font-size="13" font-weight="600" fill="#16161D">Parmesan</text>
<text x="982" y="461.62" font-size="13" font-weight="600" fill="#9A3412" text-anchor="end">−3.2 kg</text>
<text x="1140" y="461.62" font-size="13" font-weight="700" fill="#16161D" text-anchor="end">QR 610</text>
<rect x="764" y="475" width="388" height="30" rx="16" fill="#FFF0E6"/>
<text x="776" y="494.62" font-size="13" font-weight="600" fill="#16161D">Saffron</text>
<text x="982" y="494.62" font-size="13" font-weight="600" fill="#9A3412" text-anchor="end">−12.0 g</text>
<text x="1140" y="494.62" font-size="13" font-weight="700" fill="#B45309" text-anchor="end">unknown</text>
<text x="764" y="532" font-size="12.5" fill="#62626E">Saffron has no price on file — the shortage is real,</text>
<text x="764" y="550" font-size="12.5" fill="#62626E">the money is unknown. It is never shown as zero.</text>
<rect x="28" y="656" width="1144" height="152" rx="26" fill="#FFF0E6"/>
<g transform="translate(52 686) scale(0.83)" fill="none" stroke="#9A3412" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01"/></g>
<text x="84" y="702" font-size="20" font-weight="700" fill="#9A3412">Blind spots — 50 dishes sold with no recipe</text>
<text x="52" y="736" font-size="13.5" fill="#16161D">These are not counted as variance. A dish nobody has costed is an unknown, not a saving —</text>
<text x="52" y="758" font-size="13.5" fill="#16161D">so it is quarantined here until someone writes the recipe. Tap any one to open its editor.</text>
<rect x="972" y="676" width="176" height="112" rx="16" fill="#FFFFFF"/>
<text x="1060" y="750" font-size="56" font-weight="700" fill="#9A3412" text-anchor="middle">50</text>
<text x="28" y="848" font-size="12.5" fill="#62626E">opening + arrived − sold (by recipe) − waste = expected · the count says actual · the difference is the gap</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Helvetica Neue&quot;, sans-serif" font-variant-numeric="tabular-nums">
<title>Food cost screen — theoretical 29.4% against actual 32.1%, the gap by category, worst ingredients by value, and 50 uncosted dishes quarantined</title>
<rect x="0" y="0" width="1200" height="900" fill="#FFFFFF"/>
<text x="28" y="54" font-size="24" font-weight="700" fill="#16161D">Food cost — Al Sadd · September</text>
<text x="1172" y="54" font-size="14" fill="#62626E" text-anchor="end">theoretical vs actual</text>
<rect x="28" y="84" width="274" height="140" rx="28" fill="#F2F2F6"/>
<text x="52" y="116" font-size="15" font-weight="600" fill="#16161D">Theoretical</text>
<text x="52" y="172" font-size="44" font-weight="700" fill="#16161D">29.4%</text>
<text x="52" y="198" font-size="12.5" fill="#62626E">what the recipes say it should cost</text>

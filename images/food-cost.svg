<text x="762" y="258" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1.4">WHERE THE GAP IS</text>
<text x="762" y="290" font-size="11" fill="#64748B">INGREDIENT</text>
<text x="1010" y="290" font-size="11" fill="#64748B" text-anchor="end">SHORT</text>
<text x="1152" y="290" font-size="11" fill="#64748B" text-anchor="end">VALUE</text>
<rect x="756" y="300" width="404" height="38" rx="9" fill="rgba(255,255,255,0.03)"/>
<text x="770" y="324" font-size="14" font-weight="600" fill="#E2E8F0">Salmon fillet</text>
<text x="1010" y="324" font-size="13.5" font-weight="700" fill="#FB7185" text-anchor="end">−18.4 kg</text>
<text x="1152" y="324" font-size="13.5" font-weight="700" fill="#FB7185" text-anchor="end">QR 4,120</text>
<rect x="756" y="346" width="404" height="38" rx="9" fill="rgba(255,255,255,0.03)"/>
<text x="770" y="370" font-size="14" font-weight="600" fill="#E2E8F0">Ribeye</text>
<text x="1010" y="370" font-size="13.5" font-weight="700" fill="#FB7185" text-anchor="end">−9.1 kg</text>
<text x="1152" y="370" font-size="13.5" font-weight="700" fill="#FB7185" text-anchor="end">QR 3,240</text>
<rect x="756" y="392" width="404" height="38" rx="9" fill="rgba(255,255,255,0.03)"/>
<text x="770" y="416" font-size="14" font-weight="600" fill="#E2E8F0">Butter</text>
<text x="1010" y="416" font-size="13.5" font-weight="700" fill="#FB7185" text-anchor="end">−22.0 kg</text>
<text x="1152" y="416" font-size="13.5" font-weight="700" fill="#FB7185" text-anchor="end">QR 1,880</text>
<rect x="756" y="438" width="404" height="38" rx="9" fill="rgba(255,255,255,0.03)"/>

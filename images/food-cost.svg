<text x="1152" y="462" font-size="13.5" font-weight="700" fill="#FBBF24" text-anchor="end">QR 940</text>
<rect x="756" y="484" width="404" height="38" rx="9" fill="rgba(255,255,255,0.03)"/>
<text x="770" y="508" font-size="14" font-weight="600" fill="#E2E8F0">Parmesan</text>
<text x="1010" y="508" font-size="13.5" font-weight="700" fill="#FBBF24" text-anchor="end">−3.2 kg</text>
<text x="1152" y="508" font-size="13.5" font-weight="700" fill="#FBBF24" text-anchor="end">QR 610</text>
<rect x="756" y="530" width="404" height="38" rx="9" fill="rgba(255,255,255,0.03)"/>
<text x="770" y="554" font-size="14" font-weight="600" fill="#E2E8F0">Saffron</text>
<text x="1010" y="554" font-size="13.5" font-weight="700" fill="#94A3B8" text-anchor="end">−12.0 g</text>
<text x="1152" y="554" font-size="13.5" font-weight="700" fill="#94A3B8" text-anchor="end">unknown</text>
<text x="762" y="622" font-size="11.5" fill="#64748B">Saffron has no price on file — the shortage is real,</text>
<text x="762" y="640" font-size="11.5" fill="#64748B">the money is <tspan fill="#E8CE7A" font-weight="700">unknown</tspan>. It is never shown as zero.</text>
<rect x="24" y="686" width="1152" height="94" rx="14" fill="#F59E0B" fill-opacity="0.1" stroke="#F59E0B" stroke-opacity="0.42"/>
<text x="48" y="718" font-size="15" font-weight="800" fill="#FBBF24">🚦 Blind spots — 50 dishes sold with no recipe</text>
<text x="48" y="744" font-size="13" fill="#CBD5E1">These are not counted as variance. A dish nobody has costed is an unknown, not a saving —</text>
<text x="48" y="764" font-size="13" fill="#CBD5E1">so it is quarantined here until someone writes the recipe. Tap any one to open its editor.</text>
<text x="1152" y="740" font-size="30" font-weight="800" fill="#FBBF24" text-anchor="end">50</text>
<text x="24" y="820" font-size="12.5" fill="#64748B">opening + arrived − sold (by recipe) − waste = expected  ·  the count says actual  ·  the difference is the gap</text>
</svg>
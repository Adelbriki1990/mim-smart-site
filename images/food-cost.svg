<text x="922" y="172" font-size="44" font-weight="700" fill="#16161D">87%</text>
<text x="922" y="198" font-size="12.5" fill="#62626E">349 of 399 dishes costed</text>
<rect x="28" y="240" width="700" height="400" rx="26" fill="#F2F2F6"/>

<text x="636" y="481" font-size="11.5" fill="#94A3B8">3 cases · 24 croissant · 8 kunafa</text>
<rect x="1046" y="455" width="98" height="22" rx="11" fill="#38BDF8" fill-opacity="0.16" stroke="#38BDF8" stroke-opacity="0.5"/>
<text x="1095" y="470" font-size="11.5" font-weight="700" fill="#38BDF8" text-anchor="middle">packing</text>

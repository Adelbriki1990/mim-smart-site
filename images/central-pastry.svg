<text x="636" y="289" font-size="11.5" fill="#94A3B8">5 cases · 36 croissant · 10 kunafa · 3 date cake</text>
<rect x="1046" y="263" width="98" height="22" rx="11" fill="#34D399" fill-opacity="0.16" stroke="#34D399" stroke-opacity="0.5"/>
<text x="1095" y="278" font-size="11.5" font-weight="700" fill="#34D399" text-anchor="middle">sent 06:40</text>
<rect x="620" y="310" width="540" height="56" rx="9" fill="rgba(255,255,255,0.03)"/>
<text x="636" y="333" font-size="14" font-weight="600" fill="#E2E8F0">Vendome Mall</text>
<text x="636" y="353" font-size="11.5" fill="#94A3B8">4 cases · 30 croissant · 8 kunafa · 2 date cake</text>
<rect x="1046" y="327" width="98" height="22" rx="11" fill="#34D399" fill-opacity="0.16" stroke="#34D399" stroke-opacity="0.5"/>
<text x="1095" y="342" font-size="11.5" font-weight="700" fill="#34D399" text-anchor="middle">sent 06:40</text>
<rect x="620" y="374" width="540" height="56" rx="9" fill="rgba(255,255,255,0.03)"/>
<text x="636" y="397" font-size="14" font-weight="600" fill="#E2E8F0">Old Port</text>

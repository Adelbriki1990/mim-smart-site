<rect x="46" y="228" width="456" height="10" rx="5" fill="#E0A130"/>
<text x="46" y="256" font-size="11.5" fill="#64748B">batch 1 out 06:20 · 28 more proofing, out 07:45</text>
<text x="46" y="316" font-size="14" font-weight="600" fill="#E2E8F0">Kunafa</text>
<text x="562" y="316" font-size="14" font-weight="700" fill="#34D399" text-anchor="end">60<tspan fill="#64748B"> / 60</tspan></text>
<rect x="46" y="328" width="516" height="10" rx="5" fill="#4A80BC" fill-opacity="0.25"/>
<rect x="46" y="328" width="516" height="10" rx="5" fill="#34D399"/>
<text x="46" y="356" font-size="11.5" fill="#64748B">2 trays · out 06:10 · all 60 made</text>
<text x="46" y="416" font-size="14" font-weight="600" fill="#E2E8F0">Date cake</text>
<text x="562" y="416" font-size="14" font-weight="700" fill="#E0A130" text-anchor="end">11<tspan fill="#64748B"> / 18</tspan></text>
<rect x="46" y="428" width="516" height="10" rx="5" fill="#4A80BC" fill-opacity="0.25"/>
<rect x="46" y="428" width="315" height="10" rx="5" fill="#E0A130"/>
<text x="46" y="456" font-size="11.5" fill="#64748B">batch 2 in the oven · out 07:05</text>
<rect x="24" y="512" width="560" height="150" rx="14" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.08)"/>
<text x="46" y="550" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1.4">YIELD · CROISSANT BATCH 1</text>
<text x="46" y="606" font-size="36" font-weight="800" fill="#E0A130">88%</text>
<text x="166" y="594" font-size="14" font-weight="600" fill="#E2E8F0">25 kg flour → 212 croissants</text>
<text x="166" y="618" font-size="12.5" fill="#64748B">recipe expects 240 from 25 kg · 28 short · logged against batch 1</text>
<rect x="604" y="132" width="572" height="530" rx="14" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.08)"/>

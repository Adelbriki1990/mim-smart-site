<text x="46" y="162" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1.4">TODAY'S BAKE · PLANNED vs MADE</text>
<text x="46" y="216" font-size="14" font-weight="600" fill="#E2E8F0">Croissant</text>
<text x="562" y="216" font-size="14" font-weight="700" fill="#E0A130" text-anchor="end">212<tspan fill="#64748B"> / 240</tspan></text>

<text x="636" y="525" font-size="14" font-weight="600" fill="#E2E8F0">DFC</text>
<text x="636" y="545" font-size="11.5" fill="#94A3B8">5 cases · 38 croissant · 8 kunafa · 3 date cake, still in the oven</text>
<rect x="1046" y="519" width="98" height="22" rx="11" fill="rgba(255,255,255,0.07)"/>
<text x="1095" y="534" font-size="11.5" font-weight="700" fill="#94A3B8" text-anchor="middle">waiting</text>
<rect x="620" y="566" width="540" height="56" rx="9" fill="#FBBF24" fill-opacity="0.1" stroke="#FBBF24" stroke-opacity="0.42"/>
<text x="636" y="589" font-size="14" font-weight="700" fill="#FBBF24">West Bay</text>
<text x="636" y="609" font-size="11.5" fill="#CBD5E1">6 cases · <tspan fill="#FBBF24" font-weight="700">48 croissant ordered, 20 left</tspan> · 6 kunafa · 4 date cake</text>
<rect x="1046" y="583" width="98" height="22" rx="11" fill="#FBBF24" fill-opacity="0.16" stroke="#FBBF24" stroke-opacity="0.5"/>
<text x="1095" y="598" font-size="11.5" font-weight="800" fill="#FBBF24" text-anchor="middle">short 28</text>
<rect x="24" y="686" width="1152" height="68" rx="14" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.08)"/>
<text x="48" y="726" font-size="13.5" fill="#CBD5E1"><tspan fill="#E8CE7A" font-weight="700">3 of 7 branches sent</tspan> · van 2 loads Old Port + MOQ, leaves 07:10 · West Bay's 28 croissants rebake, out 07:45 on van 3</text>
<text x="1152" y="731" font-size="30" font-weight="800" fill="#34D399" text-anchor="end">15 / 32<tspan font-size="13" font-weight="600" fill="#94A3B8"> cases</tspan></text>
<text x="24" y="784" font-size="12.5" fill="#64748B">every case is a stock transfer — it leaves the pastry ledger and lands in the branch's ledger the moment it is scanned in</text>

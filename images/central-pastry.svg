<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
<title>Central Pastry bake and dispatch board at 06:52 — three production lines against plan, seven branch dispatches, and an 88% croissant yield that leaves West Bay 28 short</title>
<rect width="1200" height="800" fill="#0F172A"/>
<text x="30" y="46" font-size="23" font-weight="800" fill="#F8FAFC">Central Pastry — Sun 6 Sept · morning bake</text>
<text x="1170" y="46" font-size="15" fill="#94A3B8" text-anchor="end">06:52 · Ramesh Thapa, head baker</text>
<rect x="24" y="66" width="1152" height="2" fill="#1E293B"/>
<rect x="24" y="84" width="96" height="30" rx="15" fill="#E0A130"/>
<text x="72" y="104" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">Board</text>
<rect x="128" y="84" width="96" height="30" rx="15" fill="rgba(255,255,255,0.07)"/>
<text x="176" y="104" font-size="13" font-weight="700" fill="#94A3B8" text-anchor="middle">Orders</text>
<rect x="232" y="84" width="96" height="30" rx="15" fill="rgba(255,255,255,0.07)"/>
<text x="280" y="104" font-size="13" font-weight="700" fill="#94A3B8" text-anchor="middle">Recipes</text>

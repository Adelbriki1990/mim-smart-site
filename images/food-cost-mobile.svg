<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 940" width="420" height="940" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Helvetica Neue&quot;, sans-serif" font-variant-numeric="tabular-nums">
<title>Food cost on a phone — theoretical 29.4% against actual 32.1%, the gap by category and 50 uncosted dishes quarantined</title>
<rect x="0" y="0" width="420" height="940" fill="#FFFFFF"/>
<text x="16" y="40" font-size="20" font-weight="700" fill="#16161D">Food cost — Al Sadd</text>
